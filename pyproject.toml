[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spinpy"
version = "2.4.0"
description = "Ajuste de microestructuras espinodales a VOIs de hueso trabecular: morfometria, homogeneizacion elastica y ensayo de compresion"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Carlos Gonzalez-Torres", email = "carlos_gonzz@hotmail.es" },
    { name = "David Ortiz-Puerta" },
    { name = "Mauricio A. Sarabia-Vallejos" },
]
keywords = [
    "hueso trabecular", "microtomografia", "espinodal", "spinodoid",
    "morfometria osea", "homogeneizacion", "elementos finitos",
    "trabecular bone", "micro-CT", "bone morphometry",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Physics",
]

# NUCLEO: sin Qt y sin nada con copyleft. Es deliberado — `spinpy` se puede
# importar desde un script, un cuaderno o una tuberia sin arrastrar la
# interfaz ni sus obligaciones de licencia.
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-image>=0.21",
    "pyvista>=0.42",
]

[project.optional-dependencies]
# pyamg no es opcional "de verdad": sin el, la homogeneizacion y el ensayo
# caen a CG con Jacobi, que con el contraste 1e-6 entre hueso y vacio NO
# converge (medido: 2294 s a 32^3 sin alcanzar la tolerancia). Se separa
# porque el resto del paquete —generador y morfometria— funciona sin el.
elastico = ["pyamg>=4.2"]

# Motores FEM internos (spinpy.motores): malla suave TET10 y analisis no
# lineales sin programas externos. NGSolve es el recomendado (comparativa_
# motores/INFORME.md); su Cholesky propio resulto mas rapido que PARDISO, asi
# que no se pide MKL. scikit-fem es Python puro. SfePy y FEniCSx se detectan
# si estan instalados, pero no se piden: SfePy no tiene ruedas para Windows y
# FEniCSx solo se distribuye por conda-forge.
fem = ["ngsolve>=6.2.2601", "scikit-fem>=11"]

# Mallado TET10 para exportar solidos con superficie lisa.
malla = ["pymeshfix>=0.16", "tetgen>=0.6"]

# Lote y estadistica: descomposicion de varianza, ICC, TOST.
lote = ["pandas>=2.0", "joblib>=1.3"]

# INTERFAZ GRAFICA — ojo con la licencia.
# PyQt5 es GPL v3 o comercial: quien redistribuya la app junto con el queda
# sujeto a la GPL sobre la obra combinada, aunque este codigo sea MIT. Ver
# LICENSE. Migrar a PySide6 (LGPL) esta pendiente y es casi mecanico.
gui = [
    "PyQt5>=5.15",
    "pyvistaqt>=0.11",
    "matplotlib>=3.7",
]

test = ["pytest>=7.4"]

# Informe para publicacion: PDF (reportlab) y figuras (matplotlib). Sin ellos el
# informe se escribe igual en Markdown y avisa de lo que falta.
informe = ["reportlab>=4.0", "matplotlib>=3.7"]

todo = ["spinpy[elastico,fem,malla,lote,gui,test,informe]"]

[project.urls]
Repositorio = "https://github.com/cgt1989/spinpy"

[project.scripts]
spinpy-lote = "spinpy.cli:main_lote"
spinpy-informe = "spinpy.informe:main"
spinpy-validar-exp = "spinpy.validacion_exp:main"

[tool.setuptools]
packages = ["spinpy", "spinpy.motores"]

# ANALISIS ESTATICO. `ruff check spinpy tests` debe dar 0 avisos; lo exige el
# flujo de pruebas. Se vigilan los errores reales (F: importaciones y variables
# sin uso, nombres indefinidos; E9: sintaxis; B: trampas conocidas de Python).
# Lo que se ignora esta justificado, no tolerado por inercia.
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["comparativa_febio", "comparativa_febio_tet", "comparativa_motores",
                  "Test", "docs", "instalador", "matlab", "entornos"]

[tool.ruff.lint]
select = ["F", "E9", "E7", "B"]
ignore = [
    "E741",  # `I`, `l`, `O` como nombre: es la notacion de los textos citados (tensores, indices)
    "E702",  # `a = 1; b = 2` en una linea: se usa para asignaciones paralelas cortas
    "E731",  # `f = lambda ...` local y breve
    "B905",  # zip sin `strict=`: todos los zip son de secuencias de igual largo por construccion
    "B007",  # variable de bucle sin usar: nombra lo que se desempaqueta
    "B023",  # revisado uno a uno: las funciones se llaman en la misma iteracion
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]          # `conftest` pone la raiz en sys.path antes de importar
"visor.py" = ["E402"]         # el orden de importacion en la GUI es deliberado (DLL en Windows)
"dialogo_*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Las pruebas del nucleo numerico tardan: hay homogeneizaciones y ensayos de
# elementos finitos completos. `-m "not lento"` deja solo las rapidas.
markers = [
    "lento: tarda mas de ~30 s (homogeneizacion, ensayo FE, ajuste completo)",
]
