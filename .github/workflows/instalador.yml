# Construye el instalador de Windows y lo adjunta a la release.
#
# Se dispara al publicar una release. Tambien se lanza a mano desde Actions ->
# "Instalador de Windows" -> Run workflow, indicando la etiqueta: si la release
# no existe, se crea al final (etiqueta en el commit compilado), solo si el
# ejecutable paso su autocomprobacion.
#
# El ejecutable no depende de programas externos: los ensayos FEM los
# resuelven los motores internos (spinpy.motores); NGSolve y scikit-fem
# viajan dentro (instalador/requisitos_build.txt).
#
# Se usa el CPython oficial, no Anaconda: asi `dlls_conda.py` no tiene nada
# que resolver (ver instalador/LEEME_DESARROLLO.md, trampa 2).

name: Instalador de Windows

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      etiqueta:
        description: "Etiqueta de la release a la que se adjunta (p. ej. v1.0.0)"
        required: true
      adjuntar:
        description: "Adjuntar el instalador a la release (desmarcar para solo probar la construccion)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  construir:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      ETIQUETA: ${{ github.event.release.tag_name || inputs.etiqueta }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Version de la etiqueta frente a la del paquete
        shell: pwsh
        run: |
          $v = $env:ETIQUETA -replace '^[vV]', ''
          $paquete = (Select-String -Path pyproject.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if ($v -ne $paquete) {
              throw "La etiqueta $env:ETIQUETA no coincide con la version del paquete ($paquete)"
          }
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Construir
        shell: pwsh
        run: .\instalador\construir.ps1 -Trabajo "$env:RUNNER_TEMP\spinpy_build" -Version $env:VERSION

      # Lanzado a mano para una etiqueta que aun no tiene release: se crea
      # aqui, DESPUES de construir y comprobar el ejecutable, con la etiqueta
      # en el commit que se acaba de compilar y las notas de
      # instalador/notas/<etiqueta>.md si existen.
      - name: Crear la release si no existe
        if: github.event_name == 'workflow_dispatch' && inputs.adjuntar
        shell: pwsh
        run: |
          gh release view $env:ETIQUETA *> $null
          if ($LASTEXITCODE -eq 0) { "La release $env:ETIQUETA ya existe"; exit 0 }
          $notas = "instalador/notas/$($env:ETIQUETA).md"
          if (Test-Path $notas) {
              gh release create $env:ETIQUETA --target $env:GITHUB_SHA --title "spinpy V$env:VERSION" --notes-file $notas
          } else {
              gh release create $env:ETIQUETA --target $env:GITHUB_SHA --title "spinpy V$env:VERSION" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw "No se pudo crear la release $env:ETIQUETA" }

      - name: Adjuntar a la release
        if: github.event_name == 'release' || inputs.adjuntar
        shell: pwsh
        run: |
          gh release upload $env:ETIQUETA `
            "instalador\salida\spinpy-V$env:VERSION-instalador.exe" `
            "$env:RUNNER_TEMP\spinpy_build\spinpy-V$env:VERSION-windows.zip" `
            --clobber
